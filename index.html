<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aas-Paas</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%230ea5e9'/%3E%3Cpath d='M256 96c-70 0-126 56-126 126 0 94 126 194 126 194s126-100 126-194c0-70-56-126-126-126z' fill='%23fff'/%3E%3Ccircle cx='256' cy='222' r='48' fill='%230ea5e9'/%3E%3C/svg%3E">
<!-- Map CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:#0f172a;color:#e2e8f0;min-height:100vh;padding-bottom:30px}
  header{position:sticky;top:0;z-index:20;background:rgba(15,23,42,.95);backdrop-filter:blur(10px);padding:14px 16px 12px;border-bottom:1px solid #1e293b}
  h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
  h1 span{color:#38bdf8}
  #status{font-size:12.5px;color:#94a3b8;margin-top:5px;line-height:1.4}
  .btn{width:100%;margin-top:11px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.975)}
  .btn:disabled{opacity:.55}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid #334155;background:#1e293b;color:#cbd5e1;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .chip.on{background:#0ea5e9;border-color:#0ea5e9;color:#04212e}
  .radius{display:flex;gap:8px;padding:10px 16px 2px}
  .radius button{flex:1;padding:8px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#94a3b8;font-size:12.5px;font-weight:600;cursor:pointer}
  .radius button.on{background:#38bdf8;border-color:#38bdf8;color:#04212e}
  
  /* Map Container */
  #map-container{padding: 10px 16px 0; display: none;}
  #map{height: 220px; width: 100%; border-radius: 14px; border: 1px solid #334155; z-index: 1;}

  #list{padding:14px 16px 0;display:grid;gap:10px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.15s}
  .card:active{background:#243449;transform:scale(.985)}
  .ico{font-size:23px;flex-shrink:0;line-height:1}
  .body{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14.5px;margin-bottom:3px;line-height:1.3;word-break:break-word}
  .meta{font-size:11.5px;color:#94a3b8;line-height:1.45}
  .dist{font-size:12px;color:#38bdf8;font-weight:800;white-space:nowrap;text-align:right}
  .dist small{display:block;font-size:9.5px;color:#64748b;font-weight:600;margin-top:2px}
  .badge{display:inline-block;background:#facc1520;color:#facc15;border:1px solid #facc1545;font-size:9.5px;padding:1px 6px;border-radius:5px;margin-left:5px;vertical-align:middle;font-weight:700}
  .empty{text-align:center;color:#64748b;padding:60px 24px;font-size:14px;line-height:1.7}
  .spin{width:26px;height:26px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:r .8s linear infinite;margin:0 auto 16px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <h1>📍 Aas-<span>Paas</span></h1>
  <div id="status">Neeche button dabaiye — aapke aas paas ki famous jagah dikhegi</div>
  <button class="btn" id="locBtn">📍 Meri Location Dhoondo</button>
</header>

<div class="chips" id="chips">
  <div class="chip on" data-f="all">🎯 Sab Kuch</div>
  <div class="chip" data-f="khana">🍽️ Khana-Peena</div>
  <div class="chip" data-f="hotel">🏨 Hotel</div>
  <div class="chip" data-f="shopping">🛍️ Dukan / Shopping</div>
  <div class="chip" data-f="ghumna">📸 Ghoomne Ki Jagah</div>
</div>

<div class="radius" id="radius">
  <button data-r="1000">1 km</button>
  <button data-r="2500" class="on">2.5 km</button>
  <button data-r="5000">5 km</button>
  <button data-r="10000">10 km</button>
</div>

<!-- Map yahan aayega -->
<div id="map-container">
  <div id="map"></div>
</div>

<div id="list">
  <div class="empty">👆 Upar wala button dabaiye<br>Phir yahan list aayegi</div>
</div>

<script>
let map, markersGroup;
const state = { loc:null, places:[], cat:'all', radius:2500, busy:false };
const $ = id => document.getElementById(id);
const setStatus = s => $('status').textContent = s;

function initMap(lat, lon) {
  if (!map) {
    map = L.map('map').setView([lat, lon], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);
    markersGroup = L.layerGroup().addTo(map);
  } else {
    map.setView([lat, lon], 14);
  }
  $('map-container').style.display = 'block';
  
  markersGroup.clearLayers();
  L.circleMarker([lat, lon], {color: '#38bdf8', radius: 8, fillOpacity: 1}).addTo(markersGroup).bindPopup("Aap yahan hain");
}

function dist(a,b,c,d){
  const R=6371000, t=x=>x*Math.PI/180;
  const dLat=t(c-a), dLon=t(d-b);
  const h=Math.sin(dLat/2)**2 + Math.cos(t(a))*Math.cos(t(c))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}

function categorize(t){
  const am = t.amenity||'', to = t.tourism||'';
  if (/^(restaurant|cafe|fast_food|food_court)$/.test(am)) return 'khana';
  if (/^(hotel|guest_house|hostel|motel)$/.test(to)) return 'hotel';
  if (t.shop || am==='marketplace') return 'shopping';
  if (t.historic || /^(attraction|museum|viewpoint|artwork|gallery)$/.test(to) || t.leisure==='park') return 'ghumna';
  return 'other';
}

function iconFor(p){
  if (p.cat==='khana') return p.tags.amenity==='cafe' ? '☕' : '🍽️';
  if (p.cat==='hotel') return '🏨';
  if (p.cat==='shopping') return '🛍️';
  if (p.cat==='ghumna') return p.tags.historic ? '🏛️' : (p.tags.leisure==='park' ? '🌳' : '📸');
  return '📍';
}

function typeLabel(p){
  const t = p.tags;
  const mapObj = { restaurant:'Restaurant', cafe:'Cafe', fast_food:'Fast Food', food_court:'Food Court', hotel:'Hotel', guest_house:'Guest House', hostel:'Hostel', motel:'Motel', attraction:'Attraction', museum:'Museum', viewpoint:'Viewpoint', artwork:'Artwork', gallery:'Gallery', park:'Park', marketplace:'Market' };
  let v = mapObj[t.amenity] || mapObj[t.tourism] || mapObj[t.leisure] || null;
  if (v) return v;
  if (t.shop) return t.shop.charAt(0).toUpperCase()+t.shop.slice(1)+' Shop';
  if (t.historic) return 'Historical Place';
  return 'Place';
}

function buildQuery(lat, lon, r){
  const A = q => `node[${q}](around:${r},${lat},${lon});`;
  const parts = [
    A('"amenity"~"^(restaurant|cafe|fast_food|food_court)$"'),
    A('"tourism"~"^(hotel|guest_house|hostel|motel)$"'),
    A('"shop"~"^(supermarket|mall|department_store|clothes|bakery|convenience)$"'),
    A('"amenity"="marketplace"'),
    A('"tourism"~"^(attraction|museum|viewpoint|gallery)$"'),
    A('"historic"'),
    A('"leisure"="park"')
  ];
  return `[out:json][timeout:15];(${parts.join('')});out body 200;`;
}

async function getData(q){
  const servers = [
    'https://overpass-api.de/api/interpreter?data=',
    'https://overpass.kumi.systems/api/interpreter?data=',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter?data='
  ];
  for(let server of servers){
    try {
      let res = await fetch(server + encodeURIComponent(q));
      if(res.ok) return await res.json();
    } catch(e) {
      try {
        let proxy = 'https://api.allorigins.win/raw?url=';
        let res = await fetch(proxy + encodeURIComponent(server + encodeURIComponent(q)));
        if(res.ok) return await res.json();
      } catch(e2) {}
    }
  }
  throw new Error("All servers failed");
}

async function loadPlaces(){
  if (state.busy || !state.loc) return;
  state.busy = true;
  $('locBtn').disabled = true;
  $('list').innerHTML = '<div class="empty"><div class="spin"></div>Data la rahe hain...</div>';
  setStatus('🔎 ' + (state.radius/1000) + ' km ke andar search ho raha hai...');

  initMap(state.loc.lat, state.loc.lon);

  try{
    const data = await getData(buildQuery(state.loc.lat, state.loc.lon, state.radius));
    const seen = new Set();
    
    let places = (data.elements || [])
      .filter(e => e.tags && e.tags.name && e.lat && e.lon)
      .map(e => {
        const d = dist(state.loc.lat, state.loc.lon, e.lat, e.lon);
        return { name: e.tags.name, tags: e.tags, lat: e.lat, lon: e.lon, d: d, cat: categorize(e.tags), famous: !!(e.tags.wikidata || e.tags.wikipedia || e.tags.stars || e.tags.heritage) };
      })
      .filter(p => {
        const k = p.name.toLowerCase().trim();
        if (seen.has(k)) return false;
        seen.add(k); return true;
      });

    places.sort((a,b) => (a.d - (a.famous?1200:0)) - (b.d - (b.famous?1200:0)));
    state.places = places;

    if(places.length === 0) {
      $('list').innerHTML = '<div class="empty">Is area mein koi jagah nahi mili.<br>Kripya 5 km ya 10 km select karein.</div>';
      setStatus('❌ 0 jagah mili');
    } else {
      setStatus(`✅ ${places.length} jagah mili · ${(state.radius/1000)} km ke andar`);
      render();
    }
  }catch(err){
    $('list').innerHTML = '<div class="empty">❌ Network problem.<br><br>Kripya Internet check karein aur <b>"Dobara Search"</b> dabayein.</div>';
    setStatus('❌ Data nahi aaya');
  }finally{
    state.busy = false;
    $('locBtn').disabled = false;
  }
}

function render(){
  const list = $('list');
  const items = state.cat === 'all' ? state.places : state.places.filter(p => p.cat === state.cat);

  markersGroup.clearLayers();
  L.circleMarker([state.loc.lat, state.loc.lon], {color: '#38bdf8', radius: 8, fillOpacity: 1}).addTo(markersGroup).bindPopup("Aap yahan hain");

  items.forEach(p => {
    L.circleMarker([p.lat, p.lon], {color: '#facc15', radius: 6, fillOpacity: 0.8}).addTo(markersGroup).bindPopup(p.name);
  });

  if (!items.length){
    list.innerHTML = '<div class="empty">Is category mein kuch nahi mila.<br>Doosri category try karein.</div>';
    return;
  }

  list.innerHTML = items.map((p,i) => {
    const d = p.d < 1000 ? Math.round(p.d) + ' m' : (p.d/1000).toFixed(1) + ' km';
    const addr = [p.tags['addr:street'], p.tags['addr:city']].filter(Boolean).join(', ');
    return `<div class="card" data-i="${state.places.indexOf(p)}">
      <div class="ico">${iconFor(p)}</div>
      <div class="body">
        <div class="nm">${esc(p.name)}${p.famous?'<span class="badge">⭐ FAMOUS</span>':''}</div>
        <div class="meta">${esc(typeLabel(p))}${addr ? ' · ' + esc(addr) : ''}</div>
      </div>
      <div class="dist">${d}<small>➤ Map</small></div>
    </div>`;
  }).join('');

  list.querySelectorAll('.card').forEach(el => {
    el.onclick = () => {
      const p = state.places[+el.dataset.i];
      map.setView([p.lat, p.lon], 17); 
      window.scrollTo({ top: 0, behavior: 'smooth' }); 
    };
  });
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on'); state.cat = c.dataset.f; render();
});

$('radius').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#radius button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); state.radius = +b.dataset.r;
  if (state.loc) loadPlaces();
});

$('locBtn').onclick = () => {
  if (!navigator.geolocation) return setStatus('❌ GPS support nahi hai');
  setStatus('📡 Location dhoond rahe hain...');
  $('locBtn').disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.loc = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      $('locBtn').disabled = false;
      $('locBtn').textContent = '🔄 Dobara Search Karein';
      loadPlaces();
    },
    err => {
      $('locBtn').disabled = false;
      setStatus('❌ Location nahi mili. GPS on karein.');
    },
    { enableHighAccuracy:false, timeout:15000, maximumAge:60000 }
  );
};

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
